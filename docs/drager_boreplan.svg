<text x="291.2" y="137.5" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#c0392b">115 (hjørnezone)</text>
<text x="160.0" y="501.5" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">Blåt = vinkelbeslag (Simpson AC35350) — 2 stk. i alt (1 pr. ende).</text>
<text x="160.0" y="518.5" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">Monteret PÅ SIDEN af drageren, ikke ovenpå/under: bevarer de 205 mm frihøjde under midten.</text>
<text x="160.0" y="535.5" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">Vinge 1 mod endestykkets inderside (skruer vandret, som de to 5×80) — vinge 2 mod dragerens sideflade.</text>
<text x="160.0" y="552.5" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">Beslaget sidder i kote 210–245 (centreret i dragerens 45 mm højde); begge vinger skrues vandret ind i sidetræ.</text>
<text x="160.0" y="569.5" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">Fastgørelse: Simpson TTUFP 4,0×20 beslagskruer, FLADT hoved (ikke undersænket) — Ø2,5 pilothul.</text>
<text x="160.0" y="586.5" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">Begge beslag sidder samme side (mod vange A) — vælg i praksis den side der er nemmest at komme til.</text>
<text x="160.0" y="608.5" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#c0392b">Simpsons datablad anbefaler 2 beslag pr. samling (ét i hver side); denne BOM har kun 2 stk. i alt (1 pr. ende).</text>
<text x="160.0" y="625.5" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#c0392b">Overvej 2 ekstra beslag, hvis fuld anbefaling ønskes — koster lidt, øger sikkerhedsmargin på samlingen.</text>
<rect x="560.0" y="130.0" width="340.0" height="260.0" fill="#fbf8f1" stroke="#1f4e6b" stroke-width="1.0"/>

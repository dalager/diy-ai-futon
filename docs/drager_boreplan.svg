<text x="576.0" y="335.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">A = B = 50 mm · C (vinge-bredde) = 35 mm · t = 2 mm, varmforzinket stål</text>
<text x="576.0" y="352.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">4 × Ø5 + 1 × Ø8,5 pr. vinge — Ø8,5-hullet er kun til M8-bolt (beton), bruges ikke her.</text>
<text x="576.0" y="369.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Hulplacering her er skematisk (efter produktfoto) — se Simpson-databladet for eksakte mål.</text>
<text x="576.0" y="386.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Brug de 4 × Ø5-huller pr. vinge til TTUFP-beslagskruerne.</text>
</svg>